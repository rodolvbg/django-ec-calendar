{# A calendar: calendar.js makes it from its configuration (no inline script). #}
<div class="django-ec-calendar" id="{{ id }}" data-django-ec-calendar="{{ id }}-config">
  <p class="django-ec-calendar-status" role="status" aria-live="polite" hidden></p>
</div>
{% with config_id=id|add:"-config" %}{{ config|json_script:config_id }}{% endwith %}
